<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Argus — Governança de IA</title><style>:root{--ink:#19352f;--muted:#75817d;--green:#24634c;--lime:#dcf5b3;--line:#e3e8e2;--bg:#f5f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}h1,h2,h3,.brand{font-family:Manrope,sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}button{border:0;background:none;color:inherit}button:disabled{opacity:.4;cursor:not-allowed}h1{font-size:30px;letter-spacing:-1px;margin:8px 0 10px}h2{font-size:19px;margin:0 0 16px}h3{font-size:17px;margin:14px 0 8px}p{line-height:1.6}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.6px;font-weight:700;text-transform:uppercase}.brand{font-size:27px;font-weight:800;display:flex;gap:11px;align-items:center;letter-spacing:-1px}.brand-mark{background:var(--lime);color:var(--green);border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-size:24px}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:6px 10px;font-size:11px;font-weight:600;background:#edf3ed;color:#456852}.pill.green{background:#e7f4df;color:#3b6b29}.pill.amber{background:#fff1d9;color:#996b21}.pill.red{background:#fbe5e2;color:#a94b3f}.btn{padding:12px 18px;border-radius:8px;background:var(--green);color:white;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px}.btn.light{background:white;border:1px solid var(--line);color:var(--ink)}.btn.soft{background:var(--lime);color:var(--ink)}.btn.danger{background:#a24e43}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.sidebar{position:fixed;inset:0 auto 0 0;width:242px;background:#fff;border-right:1px solid var(--line);padding:32px 22px;display:flex;flex-direction:column;z-index:3}.workspace{background:#f6f8f3;border:1px solid var(--line);border-radius:10px;padding:13px;margin:29px 0}.navlabel{font-size:10px;letter-spacing:1.5px;color:#8a958d;margin:22px 12px 10px}.nav{width:100%;text-align:left;padding:13px 14px;border-radius:8px;color:#738079;display:flex;align-items:center;gap:12px;margin:3px 0}.nav.active{background:#eaf2e5;color:var(--green);font-weight:700}.nav:hover{background:#f2f5ef}.nav span:last-child{margin-left:auto}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:18px}.avatar{width:35px;height:35px;border-radius:50%;background:#e7eee2;display:grid;place-items:center;font-size:12px;font-weight:700}.main{margin-left:242px}.topbar{height:80px;background:#ffffffb8;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center;justify-content:space-between}.content{padding:35px 38px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:27px}.pagehead p{margin:0;color:var(--muted)}.hero{background:#eaf0e1;border:1px solid #dfe7d4;padding:25px 28px;border-radius:13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;overflow:hidden}.hero h2{font-size:21px;margin-bottom:8px}.hero p{margin:0;max-width:620px;color:#63745d}.hero-symbol{font-size:58px;color:#8da979;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat{border:1px solid var(--line);background:#fff;border-radius:11px;padding:20px}.stat strong{display:block;font-size:28px;margin:10px 0 5px}.stat small{color:var(--muted)}.toolbar{display:flex;gap:12px;justify-content:space-between;margin:27px 0 22px}.search{width:330px}.chips{display:flex;gap:6px}.chip{padding:10px 15px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--muted)}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}input,select,textarea{padding:12px 13px;border:1px solid #dce3da;border-radius:7px;background:white;color:var(--ink);width:100%}textarea{resize:vertical;min-height:100px}label{display:block;font-size:12px;font-weight:600;margin:0 0 8px}label small{font-weight:400;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:23px;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 9px 23px #19352f09}.agent-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:11px;background:#e8efe2;color:#537a41;font-size:24px}.card p{color:var(--muted);font-size:13px;margin:0 0 20px;min-height:44px}.cardmeta{font-size:11px;color:#819080;display:flex;gap:15px;margin-bottom:22px}.card .btn{width:100%;margin-top:auto}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:20px}.split{display:grid;grid-template-columns:1fr 300px;gap:22px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted);line-height:1.6}.notice{padding:14px 17px;border-radius:8px;background:#f1f5e9;border:1px solid #e1e9d4;font-size:12px;line-height:1.6}.check{display:flex;align-items:flex-start;gap:10px;margin:15px 0;font-size:13px;font-weight:400;line-height:1.5}.check input{width:16px;margin-top:2px;accent-color:var(--green)}.step{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:24px;color:#8a968c}.step b{background:var(--green);border-radius:50%;color:white;width:25px;height:25px;display:grid;place-items:center}.step i{flex:1;height:1px;background:var(--line)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#8b958d;font-weight:500;background:#fafbf8}td,th{padding:17px 13px;border-bottom:1px solid var(--line);white-space:nowrap}td{font-size:12px}td strong{font-size:13px}.textbtn{color:var(--green);font-weight:700;padding:8px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:15px;font-size:13px}.detail small{display:block;color:var(--muted);margin-bottom:6px}.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.login-left{background:#183d31;color:#fff;padding:52px 65px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}.login-left h1{font-size:49px;line-height:1.16;letter-spacing:-2px;max-width:500px}.login-left p{color:#a5bbae;max-width:410px}.orbit{width:240px;height:240px;border:1px solid #ffffff20;border-radius:50%;position:relative;margin:25px auto;display:grid;place-items:center;box-shadow:0 0 0 38px #ffffff04,0 0 0 75px #ffffff03}.orbit .brand-mark{width:90px;height:90px;font-size:54px;border-radius:23px;box-shadow:0 0 80px #b9e28f30}.sat{position:absolute;background:#355747;border:1px solid #6b836a;border-radius:12px;padding:13px;font-size:22px}.s1{top:-5px;left:25px}.s2{bottom:18px;right:0}.s3{bottom:18px;left:0}.login-right{display:grid;place-items:center;padding:40px}.login-box{width:100%;max-width:385px}.login-box h1{font-size:30px}.login-box form{margin-top:28px}.login-box label{margin-top:19px}.login-box .btn{width:100%;margin-top:24px}.divider{text-align:center;font-size:11px;color:#9ca69b;margin:25px 0}.rolebuttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rolebuttons button{padding:13px 7px;border:1px solid var(--line);background:white;border-radius:8px;font-size:12px}.login-foot{font-size:10px;color:#859181;margin-top:35px;line-height:1.8}.chatbox{min-height:430px;display:flex;flex-direction:column;gap:18px}.bubble{padding:18px 21px;background:#f2f5ed;border-radius:12px;max-width:85%;font-size:14px;line-height:1.7;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#e5eddd}.bubble.block{background:#fff0e8;color:#8b4d35}.composer{display:flex;gap:10px;margin-top:20px}.composer input{flex:1}.empty{text-align:center;padding:45px;color:var(--muted)}.foot{font-size:10px;color:#9ca59a;margin-top:28px;display:flex;justify-content:space-between}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#193d30;color:white;padding:14px 22px;border-radius:9px;z-index:20;display:none;box-shadow:0 8px 30px #0002}.mobilebrand{display:none}dialog{border:1px solid var(--line);border-radius:14px;padding:30px;max-width:600px;width:90%;color:var(--ink)}dialog::backdrop{background:#17352c70}.dialogactions{display:flex;justify-content:flex-end;margin-top:22px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.sidebar{width:210px}.main{margin-left:210px}.content{padding:27px}.stats{grid-template-columns:repeat(2,1fr)}.login-left{padding:40px}.login-left h1{font-size:40px}}@media(max-width:750px){.sidebar{position:static;width:100%;padding:16px}.sidebar .brand,.workspace,.navlabel,.sidebottom{display:none}.sidebar nav{display:flex;overflow:auto}.nav{width:auto;white-space:nowrap}.main{margin:0}.topbar{height:64px;padding:0 20px}.content{padding:22px 17px}.pagehead{align-items:flex-start;flex-direction:column}.grid,.fields{grid-template-columns:1fr}.hero-symbol{display:none}.hero{padding:20px}.toolbar{flex-direction:column}.search{width:100%}.chips{overflow:auto}.login{grid-template-columns:1fr}.login-left{display:none}.login-right{min-height:100vh;padding:25px}.mobilebrand{display:flex;margin-bottom:40px}.stats{gap:10px}.stat{padding:16px}h1{font-size:26px}.foot{line-height:1.8;flex-direction:column}}
</style></head><body><div id="app"></div><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base=[{id:1,name:'Suporte de TI',desc:'Encontre orientações e procedimentos para resolver demandas técnicas do dia a dia.',cat:'Tecnologia',icon:'⌘',status:'Homologado',owner:'Felipe Jaber Andrade',version:'1.2',purpose:'Orientar colaboradores com base nos procedimentos internos de TI.',model:'Modelo corporativo • demonstração'},{id:2,name:'Comunicação corporativa',desc:'Transforme suas ideias em comunicados, e-mails e mensagens profissionais.',cat:'Comunicação',icon:'✎',status:'Homologado',owner:'Breno Cardoso Vieira',version:'1.0',purpose:'Apoiar a redação de comunicações profissionais.',model:'Modelo corporativo • demonstração'},{id:3,name:'Assistente de RH',desc:'Consulte políticas de benefícios, férias e processos de gestão de pessoas.',cat:'Pessoas',icon:'♧',status:'Em análise',owner:'Karen Quézia Oliveira',version:'1.0',purpose:'Consultar políticas internas de RH, sem dados pessoais de colaboradores.',model:'Modelo corporativo • demonstração'}];
let agents;try{agents=JSON.parse(localStorage.getItem('argus-agents'))||base}catch{agents=base}let reviewer='Karen Quézia Oliveira';let role='colaborador',view='login',filter='Todos',query='',selected=1;let events=[{time:'09:42',user:'Breno Cardoso Vieira',agent:'Suporte de TI',action:'Execução permitida',result:'Permitido'},{time:'09:35',user:'Breno Cardoso Vieira',agent:'Comunicação corporativa',action:'Política de dados aplicada',result:'Bloqueado'},{time:'09:20',user:'Karen Quézia Oliveira',agent:'Assistente de RH',action:'Versão submetida',result:'Em análise'}];
function save(){localStorage.setItem('argus-agents',JSON.stringify(agents))}function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
const badge=s=>`<span class="pill ${s==='Homologado'||s==='Permitido'?'green':s==='Rejeitado'||s==='Bloqueado'||s==='Suspenso'?'red':'amber'}">${s==='Homologado'?'✓ ':''}${esc(s)}</span>`;
const brand=`<div class="brand"><span class="brand-mark">◈</span>argus<span style="font-size:10px;letter-spacing:1px;font-weight:500;margin:12px 0 0 -5px">AI</span></div>`;
function enter(r){role=r;go('catalog')}function go(v){view=v;query='';render();window.scrollTo(0,0)}
function login(){return `<div class="login"><section class="login-left">${brand}<div><span class="eyebrow" style="color:#b7d599">INTELIGÊNCIA COM RESPONSABILIDADE</span><h1>O potencial da IA.<br>O controle da<br>sua empresa.</h1><p>Um ambiente para conectar pessoas a agentes aprovados, com propósito e governança.</p><div class="orbit"><span class="brand-mark">◈</span><span class="sat s1">⌘</span><span class="sat s2">✎</span><span class="sat s3">✓</span></div></div><div class="row"><span class="pill" style="background:#315443;color:#cce0bf">✓ Agentes homologados</span><span style="font-size:11px;color:#a5bbae">Acesso controlado. Uso rastreável.</span></div></section><section class="login-right"><div class="login-box"><div class="mobilebrand">${brand}</div><span class="pill">PROTÓTIPO INTERATIVO • TCC</span><h1>Bem-vindo de volta.</h1><p class="muted">Acesse seu ambiente de inteligência corporativa.</p><form id="loginform"><label for="email">E-mail corporativo</label><input id="email" type="email" value="breno@empresa.exemplo" required autocomplete="off"><label for="password">Senha de demonstração</label><input id="password" type="password" value="demonstracao" required autocomplete="off"><button class="btn" type="submit">Entrar no ambiente <span>→</span></button></form><div class="divider">OU EXPLORE UM PERFIL DE DEMONSTRAÇÃO</div><div class="rolebuttons"><button onclick="enter('colaborador')">♙ Colaborador</button><button onclick="enter('gestor')">◇ Governança</button></div><p class="hint">Acesso simulado. Não informe credenciais ou dados reais. Nenhuma mensagem é enviada a uma IA.</p><div class="login-foot">PROJETO ACADÊMICO • ENGENHARIA DE SOFTWARE<br>Breno Cardoso Vieira · Karen Quézia Oliveira<br>Felipe Jaber Andrade · Marya Laura Menezes</div></div></section></div>`}
const titles={catalog:'Agentes disponíveis',manage:'Gestão de agentes',register:'Cadastrar agente',review:'Homologação',permissions:'Pessoas e acessos',audit:'Auditoria',chat:'Ambiente do agente'};
function shell(body){const nav=(id,icon,text,count='')=>`<button class="nav ${view===id?'active':''}" onclick="go('${id}')"><span>${icon}</span>${text}<span>${count}</span></button>`;return `<aside class="sidebar">${brand}<div class="workspace"><div class="row"><span class="avatar" style="border-radius:8px">AC</span><div><b style="font-size:12px">Acme Corporation</b><div class="hint" style="font-size:10px">Ambiente de demonstração</div></div></div></div><nav><div class="navlabel">ESPAÇO DE TRABALHO</div>${nav('catalog','▦','Meus agentes')}${role==='gestor'?`<div class="navlabel">GOVERNANÇA</div>${nav('manage','◈','Gestão de agentes')}${nav('review','◇','Homologação',agents.filter(a=>a.status==='Em análise').length)}${nav('permissions','♙','Pessoas e acessos')}${nav('audit','≡','Auditoria')}`:''}</nav><div class="sidebottom"><div class="notice" style="font-size:11px">◉ Protótipo acadêmico<br><span class="muted">Interações e políticas simuladas.</span></div><button class="nav" onclick="go('login')">↪ Sair do ambiente</button><div class="row"><span class="avatar">${role==='gestor'?'KQ':'BC'}</span><div style="font-size:11px"><b>${role==='gestor'?'Karen Quézia':'Breno Cardoso'}</b><div class="hint">${role==='gestor'?'Gestora de governança':'Colaborador'}</div></div></div></div></aside><main class="main"><header class="topbar"><div class="muted" style="font-size:12px">Workspace <span style="margin:0 12px">/</span><span style="color:var(--ink)">${titles[view]}</span></div><div class="row"><button class="pill" onclick="enter(role==='gestor'?'colaborador':'gestor')">⇄ ${role==='gestor'?'Governança':'Colaborador'}</button><span class="avatar">${role==='gestor'?'KQ':'BC'}</span></div></header><div class="content">${body}<div class="foot"><span>ARGUS · Governança de agentes de inteligência artificial</span><span>Protótipo navegável · Dados fictícios</span></div></div></main>`}
function head(kicker,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow muted">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function catalog(){return head('SEU ESPAÇO DE TRABALHO',role==='gestor'?'Inteligência para o seu trabalho.':'Olá, Breno. Vamos trabalhar?','Escolha um agente aprovado para apoiar suas atividades.')+`<div class="hero"><div><span class="eyebrow" style="color:#64804e">IA COM PROPÓSITO</span><h2>O agente certo para cada tarefa.</h2><p>Explore ferramentas homologadas e siga as orientações de uso. Evite compartilhar informações sensíveis.</p></div><span class="hero-symbol">◈</span></div><div class="row between"><h2 style="margin:0">Seu catálogo de agentes</h2><span class="muted" style="font-size:12px">${agents.filter(a=>a.status==='Homologado').length} disponíveis</span></div><div class="toolbar"><input class="search" aria-label="Buscar agentes" placeholder="⌕  Buscar por nome ou finalidade..." oninput="query=this.value;drawCards()"><div class="chips">${['Todos','Tecnologia','Comunicação','Pessoas'].map(c=>`<button class="chip ${filter===c?'active':''}" onclick="filter='${c}';document.querySelectorAll('.chip').forEach(e=>e.classList.remove('active'));this.classList.add('active');drawCards()">${c}</button>`).join('')}</div></div><div id="cards" class="grid"></div><div class="notice" style="margin-top:25px">◇ <b>Não encontrou o agente que precisa?</b> Agentes em análise aparecem no catálogo após a aprovação da governança. <button class="textbtn" onclick="showHelp()">Como funciona →</button></div>`}
function drawCards(){const list=agents.filter(a=>a.status==='Homologado'&&(filter==='Todos'||a.cat===filter)&&(a.name+' '+a.desc).toLowerCase().includes(query.toLowerCase()));$('#cards').innerHTML=list.length?list.map(a=>`<article class="card"><div class="row between"><span class="agent-icon">${a.icon||'◈'}</span>${badge(a.status)}</div><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p><div class="cardmeta"><span>◷ v${esc(a.version)}</span><span>▧ ${esc(a.cat)}</span></div><button class="btn light" onclick="selected=${a.id};go('chat')">Iniciar conversa <span>↗</span></button></article>`).join(''):'<div class="empty full">Nenhum agente encontrado para este filtro.</div>'}
function manage(){return head('CONTROLE E ORGANIZAÇÃO','Gestão de agentes','Acompanhe o ciclo de vida dos agentes da organização.',`<button class="btn" onclick="go('register')">+ Cadastrar agente</button>`)+`<div class="stats">${[['Total de agentes',agents.length,'No ambiente'],['Homologados',agents.filter(a=>a.status==='Homologado').length,'Disponíveis no catálogo'],['Em análise',agents.filter(a=>a.status==='Em análise').length,'Aguardando decisão'],['Outros estados',agents.filter(a=>!['Homologado','Em análise'].includes(a.status)).length,'Rascunhos e suspensões']].map(s=>`<div class="stat"><span class="muted">${s[0]}</span><strong>${s[1]}</strong><small>${s[2]}</small></div>`).join('')}</div><div class="panel tablewrap"><table><thead><tr><th>Agente</th><th>Responsável</th><th>Versão</th><th>Status</th><th>Ação</th></tr></thead><tbody>${agents.map(a=>`<tr><td><strong>${esc(a.name)}</strong><br><span class="muted">${esc(a.cat)}</span></td><td>${esc(a.owner)}</td><td>v${esc(a.version)}</td><td>${badge(a.status)}</td><td>${a.status==='Homologado'?`<button class="textbtn" onclick="suspend(${a.id})">Suspender</button>`:a.status==='Rascunho'?`<button class="textbtn" onclick="submitDraft(${a.id})">Submeter</button>`:a.status==='Em análise'?`<button class="textbtn" onclick="selected=${a.id};go('review')">Avaliar →</button>`:'<span class="muted">Sem ação pendente</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function register(){return head('NOVO AGENTE','Da ideia ao uso responsável.','Defina a finalidade e as condições de uso antes da homologação.')+`<div class="step"><b>1</b> Cadastro <i></i><b>2</b> Homologação <i></i><b>3</b> Disponibilização</div><form id="agentform"><div class="split"><div><div class="panel"><h2>Informações do agente</h2><div class="fields"><div><label for="aname">Nome do agente *</label><input id="aname" name="name" required placeholder="Ex.: Assistente de projetos"></div><div><label for="acat">Área de atuação *</label><select id="acat" name="cat"><option>Tecnologia</option><option>Comunicação</option><option>Pessoas</option></select></div><div class="full"><label for="adesc">Descrição para o catálogo *</label><textarea id="adesc" name="desc" required placeholder="Explique como o agente ajuda o colaborador."></textarea></div><div class="full"><label for="apurpose">Finalidade e instruções de uso *</label><textarea id="apurpose" name="purpose" required placeholder="Defina as tarefas permitidas e os limites do agente."></textarea></div><div><label for="aowner">Responsável pelo agente</label><select id="aowner" name="owner"><option>Felipe Jaber Andrade</option><option>Breno Cardoso Vieira</option><option>Marya Laura Menezes</option><option>Karen Quézia Oliveira</option></select></div><div><label for="amodel">Modelo / provedor</label><select id="amodel" name="model"><option>Modelo corporativo • demonstração</option><option>Modelo local • demonstração</option></select></div></div></div><div class="panel"><h2>Dados, ferramentas e permissões</h2><div class="fields"><div><label for="adata">Classificação permitida</label><select id="adata" name="data"><option>Dados públicos e fictícios</option><option>Procedimentos internos fictícios</option></select></div><div><label for="atool">Ferramenta autorizada</label><select id="atool" name="tool"><option>Nenhuma ferramenta externa</option><option>Consulta à base fictícia (somente leitura)</option></select></div></div><label class="check"><input type="checkbox" required> Confirmo que a finalidade, as fontes e as permissões foram revisadas para esta demonstração.</label></div><div class="row between"><button type="button" class="btn light" onclick="go('manage')">Cancelar</button><div class="row"><button class="btn light" type="submit" name="mode" value="draft">Salvar rascunho</button><button class="btn" type="submit" name="mode" value="review">Enviar para homologação →</button></div></div></div><aside><div class="panel"><span class="agent-icon">◇</span><h3>Governança desde o início.</h3><p class="hint">O agente só estará disponível após a aprovação de uma pessoa diferente da responsável pela submissão.</p><hr style="border:0;border-top:1px solid var(--line)"><p class="hint">✓ Finalidade profissional definida<br>✓ Permissões explícitas<br>✓ Dados permitidos delimitados<br>✓ Versão rastreável</p></div><div class="notice">Este cadastro é uma simulação. As alterações são salvas apenas neste navegador.</div></aside></div></form>`}
function review(){const pending=agents.filter(a=>a.status==='Em análise');let a=pending.find(a=>a.id===selected)||pending[0];if(!a)return head('APROVAÇÃO E CONFIANÇA','Homologação','Avalie agentes antes de disponibilizá-los.')+`<div class="panel empty"><h2>Tudo em dia.</h2><p>Não há agentes aguardando avaliação.</p><button class="btn" onclick="go('register')">Cadastrar novo agente</button></div>`;selected=a.id;return head('APROVAÇÃO E CONFIANÇA','Homologação de agentes','Revise finalidade, permissões e evidências antes de decidir.',badge('Em análise'))+`<div class="toolbar"><select aria-label="Selecionar agente pendente" onchange="selected=Number(this.value);render()">${pending.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${esc(x.name)} • v${esc(x.version)}</option>`).join('')}</select></div><div class="split"><div><div class="panel"><div class="row"><span class="agent-icon">${a.icon||'◈'}</span><div><h2 style="margin:0">${esc(a.name)}</h2><span class="hint">Versão ${esc(a.version)} · ${esc(a.cat)}</span></div></div><p>${esc(a.purpose)}</p><div class="detail"><div><small>Responsável</small>${esc(a.owner)}</div><div><small>Submetido por</small>${esc(a.submitter||'Felipe Jaber Andrade')}</div><div><small>Dados permitidos</small>${esc(a.data||'Procedimentos internos fictícios')}</div><div><small>Ferramenta</small>${esc(a.tool||'Consulta à base fictícia')}</div></div></div><div class="panel"><h2>Checklist de homologação</h2><p class="hint">Confirme os critérios revisados para habilitar a aprovação.</p>${['Finalidade profissional e limites claramente definidos','Dados e fontes compatíveis com a política','Permissões e ferramentas com acesso mínimo necessário','Cenários de acesso indevido e bloqueio revisados','Responsável e versão identificados'].map((t,i)=>`<label class="check"><input class="reviewcheck" type="checkbox" onchange="updateApproval()">${t}</label>`).join('')}<button class="textbtn" onclick="evidence()">▤ Consultar evidências simuladas →</button></div></div><aside><div class="panel"><h2>Decisão da avaliação</h2><label for="reviewer">Avaliador de demonstração</label><select id="reviewer" onchange="reviewer=this.value"><option ${reviewer==='Karen Quézia Oliveira'?'selected':''}>Karen Quézia Oliveira</option><option ${reviewer==='Felipe Jaber Andrade'?'selected':''}>Felipe Jaber Andrade</option></select><p class="hint">Selecione alguém diferente de quem submeteu.</p><label for="reason">Parecer / justificativa *</label><textarea id="reason" placeholder="Registre a justificativa da decisão..." oninput="updateApproval()"></textarea><button id="approve" class="btn" style="width:100%;margin:18px 0 10px" disabled onclick="decide('Homologado')">✓ Aprovar e disponibilizar</button><button class="btn light" style="width:100%" onclick="decide('Rejeitado')">Solicitar ajustes / rejeitar</button><p class="hint">A decisão será registrada na auditoria e atualizará o catálogo.</p></div><div class="notice">◇ Homologação representa uma aprovação interna. Não elimina todos os riscos de uso.</div></aside></div>`}
function updateApproval(){if($('#approve'))$('#approve').disabled=![...document.querySelectorAll('.reviewcheck')].every(e=>e.checked)||!$('#reason').value.trim()}
function decide(status){const a=agents.find(a=>a.id===selected);if(!$('#reason').value.trim())return toast('Informe uma justificativa para a decisão.');if((a.submitter||'Felipe Jaber Andrade')===reviewer)return toast('A pessoa que submeteu não pode aprovar ou rejeitar sua própria solicitação.');a.status=status;a.reason=$('#reason').value;save();events.unshift({time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),user:reviewer,agent:a.name,action:status==='Homologado'?'Versão homologada':'Ajustes solicitados',result:status});toast(status==='Homologado'?'Agente homologado e disponível no catálogo.':'Avaliação registrada. Agente não publicado.');render()}
function suspend(id){const a=agents.find(a=>a.id===id);a.status='Suspenso';save();events.unshift({time:'Agora',user:'Karen Quézia Oliveira',agent:a.name,action:'Agente suspenso',result:'Suspenso'});render();toast('Agente suspenso. Novas execuções estão bloqueadas.')}
function submitDraft(id){const a=agents.find(a=>a.id===id);a.status='Em análise';save();go('review');toast('Rascunho enviado para homologação.')}
function chat(){const a=agents.find(a=>a.id===selected);return head('ASSISTENTE CORPORATIVO',esc(a.name),'Um espaço dedicado às suas atividades profissionais.',`<button class="btn light" onclick="go('catalog')">← Voltar ao catálogo</button>`)+`<div class="split"><div class="panel"><div class="row between" style="padding-bottom:18px;border-bottom:1px solid var(--line)"><span class="row"><span class="agent-icon">${a.icon||'◈'}</span><b>${esc(a.name)}</b></span>${badge(a.status)}</div><div class="chatbox" id="messages"><div class="bubble" style="margin-top:20px">Olá, Breno! Posso ajudar com ${a.cat==='Tecnologia'?'procedimentos de suporte de TI':a.cat==='Pessoas'?'políticas internas de pessoas':'comunicações profissionais'}. O que vamos fazer hoje?</div><div class="row wrap"><button class="chip" onclick="example('Preciso de ajuda para acessar a VPN corporativa.')">Acessar a VPN</button><button class="chip" onclick="example('Escreva um comunicado sobre manutenção programada.')">Criar um comunicado</button><button class="chip" onclick="example('Minha senha é exemplo123. Pode compartilhar?')">Testar bloqueio de dados</button></div></div><form class="composer" id="chatform"><input id="message" aria-label="Mensagem ao agente" placeholder="Descreva sua tarefa profissional..." required><button class="btn">Enviar ↑</button></form><p class="hint" style="text-align:center;font-size:10px">Respostas demonstrativas predefinidas. Não há conexão com um modelo de IA.</p></div><aside><div class="panel"><h2>Sobre este agente</h2><p class="hint">${esc(a.purpose)}</p><div class="detail" style="grid-template-columns:1fr"><div><small>Responsável</small>${esc(a.owner)}</div><div><small>Versão homologada</small>v${esc(a.version)}</div><div><small>Finalidade</small>Uso profissional</div></div></div><div class="notice">✓ Utilize dados fictícios<br>✓ Revise as respostas<br>✓ Respeite a finalidade do agente</div></aside></div>`}
function example(s){$('#message').value=s;$('#message').focus()}
function send(){const text=$('#message').value.trim();if(!text)return;const a=agents.find(a=>a.id===selected);if(a.status!=='Homologado')return toast('Agente indisponível.');const blocked=/senha|cpf|segredo|token|confidencial/i.test(text),personal=/namorada|filme|receita de bolo|hor[oó]scopo/i.test(text);let answer=blocked?'Solicitação bloqueada pela política de dados. Remova credenciais ou informações sensíveis e reformule sua mensagem. Nenhum conteúdo foi enviado a um provedor.':personal?'Esta solicitação parece estar fora da finalidade profissional deste agente. Reformule indicando a atividade de trabalho que deseja realizar.':a.cat==='Tecnologia'?'Exemplo de orientação de TI:\n1. Confirme sua conexão com a internet.\n2. Abra o cliente VPN aprovado pela empresa.\n3. Utilize seu acesso corporativo e autenticação adicional.\n4. Se o erro persistir, abra um chamado com a mensagem de erro, sem incluir senhas.\n\nFonte demonstrativa: Procedimentos internos • TI-004.':a.cat==='Pessoas'?'Exemplo de orientação de RH:\nConsulte a política interna de férias e alinhe o período pretendido com sua liderança. Nesta demonstração, nenhuma informação individual de colaboradores é acessada.':'Exemplo de rascunho:\n\nOlá, equipe!\nInformamos que haverá uma manutenção programada nos sistemas corporativos. Confirmaremos a data e o período de indisponibilidade antes da execução. Em caso de dúvidas, entre em contato com o suporte de TI.\n\nAgradecemos a compreensão.\n\nRevise e adapte as informações antes de utilizar.';$('#messages').insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(text)}</div><div class="bubble ${blocked||personal?'block':''}">${esc(answer)}</div>`);$('#message').value='';events.unshift({time:'Agora',user:'Breno Cardoso Vieira',agent:a.name,action:blocked?'Política de dados':personal?'Política de finalidade':'Execução demonstrativa',result:blocked||personal?'Bloqueado':'Permitido'});$('#message').scrollIntoView({behavior:'smooth',block:'center'})}
function permissions(){return head('ADMINISTRAÇÃO','Pessoas e acessos','Organize os perfis e o acesso aos agentes da empresa.')+`<div class="notice" style="margin-bottom:22px">Permissões demonstrativas. Os controles desta interface não representam autenticação ou autorização de um sistema real.</div><div class="panel tablewrap"><h2>Equipe do projeto</h2><table><thead><tr><th>Pessoa</th><th>Setor</th><th>Perfil</th><th>Acesso</th></tr></thead><tbody>${[['Breno Cardoso Vieira','Comunicação','Colaborador'],['Karen Quézia Oliveira','Governança','Gestor'],['Felipe Jaber Andrade','Tecnologia','Administrador'],['Marya Laura Menezes','Comunicação','Colaborador']].map((u,i)=>`<tr><td><strong>${u[0]}</strong></td><td>${u[1]}</td><td><select aria-label="Perfil de ${u[0]}" onchange="toast('Perfil atualizado nesta demonstração.')">${['Colaborador','Gestor','Administrador'].map(p=>`<option ${p===u[2]?'selected':''}>${p}</option>`).join('')}</select></td><td><label class="check"><input type="checkbox" checked onchange="toast(this.checked?'Acesso habilitado na demonstração.':'Acesso desabilitado na demonstração.')"> Ativo</label></td></tr>`).join('')}</tbody></table></div>`}
function audit(){return head('VISIBILIDADE E RASTREABILIDADE','Auditoria de uso','Consulte eventos e decisões das políticas, sem expor o conteúdo das mensagens.')+`<div class="panel"><div class="toolbar" style="margin-top:0"><h2>Eventos recentes</h2><select style="width:200px" aria-label="Filtrar resultado" onchange="drawEvents(this.value)"><option>Todos os resultados</option><option>Permitido</option><option>Bloqueado</option><option>Homologado</option></select></div><div class="tablewrap"><table><thead><tr><th>Horário</th><th>Usuário</th><th>Agente</th><th>Evento</th><th>Resultado</th></tr></thead><tbody id="eventrows"></tbody></table></div></div><div class="notice">São registrados apenas metadados de demonstração. Eventos desta sessão são reiniciados ao recarregar a página.</div>`}
function drawEvents(f='Todos os resultados'){$('#eventrows').innerHTML=events.filter(e=>f==='Todos os resultados'||e.result===f).map(e=>`<tr><td>${esc(e.time)}</td><td>${esc(e.user)}</td><td>${esc(e.agent)}</td><td>${esc(e.action)}</td><td>${badge(e.result)}</td></tr>`).join('')||'<tr><td colspan="5">Nenhum evento encontrado.</td></tr>'}
function modal(html){const d=document.createElement('dialog');d.innerHTML=html+'<div class="dialogactions"><button class="btn" onclick="this.closest(\'dialog\').close()">Entendi</button></div>';document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal()}
function showHelp(){modal('<h2>Da aprovação ao seu catálogo</h2><p>Um responsável cadastra o agente e define sua finalidade. A governança revisa a versão, as permissões e as evidências. Somente depois da homologação o agente fica disponível.</p><p class="hint">Use o botão de perfil no topo para explorar também a área de governança.</p>')}
function evidence(){modal('<h2>Evidências de demonstração</h2><p>Exemplos para compor o checklist de uma homologação:</p><p>✓ Acesso sem permissão: execução recusada.<br>✓ Marcador confidencial: envio bloqueado.<br>✓ Falha no verificador: solicitação interrompida.<br>✓ Uso permitido: execução registrada.</p><div class="notice">Estes são cenários ilustrativos, não resultados de testes de segurança executados.</div>')}
function render(){if(view==='login'){$('#app').innerHTML=login();$('#loginform').onsubmit=e=>{e.preventDefault();enter('colaborador')};return}if(role!=='gestor'&&['manage','register','review','permissions','audit'].includes(view))view='catalog';$('#app').innerHTML=shell(({catalog,manage,register,review,permissions,audit,chat}[view]||catalog)());if(view==='catalog')drawCards();if(view==='audit')drawEvents();if(view==='chat')$('#chatform').onsubmit=e=>{e.preventDefault();send()};if(view==='register')$('#agentform').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const status=e.submitter.value==='draft'?'Rascunho':'Em análise';agents.push({...data,id:Date.now(),version:'1.0',icon:'◈',submitter:'Karen Quézia Oliveira',status});save();go('manage');toast(status==='Rascunho'?'Rascunho salvo.':'Agente enviado. Outro avaliador deverá homologar esta submissão.')}}render();
</script></body></html>
