# =====================================================================================================
# Perfil de PRODUÇÃO: PostgreSQL e segredos SEMPRE por variáveis de ambiente (veja backend/.env.example).
# Uso: java -jar argus-api.jar --spring.profiles.active=prod
# Sobrescreve os valores de desenvolvimento do application.properties.
# =====================================================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/argus}
spring.datasource.username=${DB_USERNAME:argus}
spring.datasource.password=${DB_PASSWORD:argus}
spring.h2.console.enabled=false

# Atrás de proxy/load balancer (HTTPS terminado no proxy), defina FORWARD_HEADERS_STRATEGY=framework
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

argus.seed.enabled=false

# Obrigatório, ao menos 32 bytes: sem ARGUS_JWT_SECRET a aplicação não sobe. Gere com: openssl rand -base64 48
argus.security.jwt.secret=${ARGUS_JWT_SECRET:}
argus.security.refresh-token.cookie.secure=true
argus.security.login.lock-duration=15m
# Ex.: https://argus.suaempresa.com.br (separe várias origens por vírgula)
argus.security.cors.allowed-origins=${ARGUS_CORS_ORIGINS:}

logging.level.br.com.argus=INFO
