# Perfil de desenvolvimento: H2 em memória (modo PostgreSQL) + dados de demonstração.
# Nada aqui deve ser usado em produção.
spring:
  datasource:
    url: jdbc:h2:mem:argus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      # http://localhost:8080/h2-console — JDBC URL: jdbc:h2:mem:argus · usuário: sa · senha: (vazia)
      # Só no perfil dev e só acessível a partir do próprio computador (web-allow-others=false).
      enabled: true

argus:
  seed:
    password: Argus@2026
  security:
    jwt:
      secret: dev-only-secret-nao-use-em-producao-0123456789
    refresh-token:
      cookie:
        secure: false # permite testar em http://localhost com qualquer cliente HTTP
    login:
      lock-duration: 1m # em produção são 15 min; aqui é curto para não travar uma demonstração
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    br.com.argus: DEBUG
