# Configuração base (produção / PostgreSQL). Segredos SEMPRE via variáveis de ambiente.
# Para desenvolvimento local sem banco instalado, use o perfil "dev" (./mvnw spring-boot:run).
spring:
  application:
    name: argus-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/argus}
    username: ${DB_USERNAME:argus}
    password: ${DB_PASSWORD:argus}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
  # Atrás de proxy/load balancer (HTTPS terminado no proxy), defina FORWARD_HEADERS_STRATEGY=framework
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

argus:
  security:
    jwt:
      issuer: argus-api
      # Gere com: openssl rand -base64 48
      secret: ${ARGUS_JWT_SECRET:}
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
      session-max-lifetime: 30d
      reuse-grace-period: 10s
      cookie:
        name: argus_refresh
        path: /api/v1/auth
        secure: true
        same-site: Strict
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    cors:
      # Ex.: https://argus.suaempresa.com.br (separe várias origens por vírgula)
      allowed-origins: ${ARGUS_CORS_ORIGINS:}
