# =====================================================================================================
# Argus API: configuração padrão = DESENVOLVIMENTO / DEMONSTRAÇÃO
# Tudo fixo aqui, sem variáveis de ambiente: sobe direto com ./mvnw spring-boot:run ou java -jar.
# H2 em memória (modo PostgreSQL) + dados de demonstração.
#
# As chaves abaixo são de desenvolvimento e estão num repositório público: NUNCA use em produção.
# Produção (PostgreSQL, segredos por variável de ambiente): --spring.profiles.active=prod
# =====================================================================================================

spring.application.name=argus-api

# ---------- Banco de dados: H2 em memória ----------
spring.datasource.url=jdbc:h2:mem:argus;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:argus, usuário sa, senha vazia).
# Só aceita acesso a partir do próprio computador (web-allow-others=false).
spring.h2.console.enabled=true

spring.jpa.open-in-view=false
# O schema é responsabilidade do Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.mvc.problemdetails.enabled=true

# ---------- Servidor ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# ---------- Dados de demonstração (4 usuários e 3 agentes, criados se o banco estiver vazio) ----------
argus.seed.enabled=true
argus.seed.password=Argus@2026

# ---------- Segurança: chaves de desenvolvimento ----------
argus.security.jwt.issuer=argus-api
argus.security.jwt.secret=dev-only-secret-nao-use-em-producao-0123456789
argus.security.jwt.access-token-ttl=15m

argus.security.refresh-token.ttl=7d
argus.security.refresh-token.session-max-lifetime=30d
argus.security.refresh-token.reuse-grace-period=10s
argus.security.refresh-token.cookie.name=argus_refresh
argus.security.refresh-token.cookie.path=/api/v1/auth
# false permite testar em http://localhost; em produção é true (só HTTPS)
argus.security.refresh-token.cookie.secure=false
argus.security.refresh-token.cookie.same-site=Strict

argus.security.login.max-failed-attempts=5
# Curto para não travar uma demonstração; em produção são 15 min
argus.security.login.lock-duration=1m

# Frontends de desenvolvimento rodando em outra porta (o frontend do próprio Spring Boot não precisa de CORS)
argus.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000

logging.level.br.com.argus=DEBUG
