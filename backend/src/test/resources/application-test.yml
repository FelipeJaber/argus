spring:
  datasource:
    url: jdbc:h2:mem:argus-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

argus:
  security:
    jwt:
      secret: test-secret-0123456789-0123456789-0123456789
    refresh-token:
      # Sem janela de tolerância: reapresentar um token rotacionado é sempre tratado como reuso.
      reuse-grace-period: 0s
      cookie:
        secure: false
    login:
      max-failed-attempts: 3
