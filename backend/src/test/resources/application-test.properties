# Perfil dos testes de integração: banco próprio e vazio (cada teste cria seus dados), sem console do H2.
spring.datasource.url=jdbc:h2:mem:argus-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false

argus.seed.enabled=false

argus.security.jwt.secret=test-secret-0123456789-0123456789-0123456789
# Sem janela de tolerância: reapresentar um token rotacionado é sempre tratado como reuso.
argus.security.refresh-token.reuse-grace-period=0s
argus.security.login.max-failed-attempts=3
argus.security.login.lock-duration=15m
argus.security.cors.allowed-origins=

logging.level.br.com.argus=INFO
